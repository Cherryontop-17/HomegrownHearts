name: CI

# ── PAUSED 2026-08-06 ──────────────────────────────────────────────────────
# Runs on request only. Every push was reporting a failure we could not
# diagnose (the job died in 11-23s, before `npm ci` — which takes 37s — could
# even finish), and a permanently red repository is worse than no signal: you
# stop reading it, and then a real failure goes unnoticed too.
#
# Nothing here is deleted and nothing is weakened. To run it: Actions tab ->
# CI -> "Run workflow". To restore automatic runs, delete the `#` from the six
# lines below.
#
# ⚠️ While this is paused, NOTHING checks a commit automatically. Run
# `npm run check:all` locally before deploying — same twelve gates.
#
# This does NOT affect publishing: Cloudflare Workers Builds pulls from GitHub
# and builds on its own, so the site deploys whatever the workflow says.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, format, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches missing Spanish translations: `es` is typed as
      # Record<UIKey, string>, so an omitted key fails here.
      - name: Type-check
        run: npm run check

      - name: Check formatting
        run: npm run format:check

      # docs/COMPLIANCE.md. Rules 1 and 2 are the line between a student food
      # project and two minors making unlicensed medical claims and
      # misrepresenting a charity. Scans both languages.
      - name: Compliance
        run: npm run check:compliance

      # Palette gate for task 6.3. Reads the tokens out of global.css and fails
      # if any text pairing drops below WCAG AA on any section band.
      - name: Contrast
        run: npm run check:contrast

      # Task 1.3's acceptance criterion. Reads the real cmap out of each
      # .woff2 and fails if any character in the EN + ES copy is missing —
      # the difference between Spanish rendering correctly and flashing a
      # fallback serif on every page load.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install fontTools
        run: pip install fonttools brotli

      - name: Font coverage
        run: npm run check:fonts

      - name: Build
        run: npm run build

      # Post-build, because it reads the rendered HTML. Gates task 6.11:
      # hreflang and canonical must agree exactly or Google silently drops
      # the EN/ES pairing.
      - name: i18n URLs
        run: npm run check:i18n

      # Both browser gates run against one server, started and stopped inside a
      # single step. Backgrounding it in one step and using it from another
      # relies on the process outliving the shell that owns it, which is not a
      # guarantee worth depending on.
      #
      #   Overflow — mobile is the default case for this audience, so "no
      #   horizontal scroll" is a gate rather than a manual pass. Both locales:
      #   Spanish runs ~20% longer, so ES is where a layout breaks first.
      #
      #   Motion — the critical check is reduced-motion. Every reveal works by
      #   hiding content then showing it, so a broken path leaves a
      #   reduced-motion reader with a blank page, and a developer without the
      #   OS setting on never sees it.
      #   Accessibility — axe on every route, plus the things axe cannot see:
      #   44px target sizes, alt text, and the keyboard path through the skip
      #   link and the mobile drawer. This gate has caught real serious-level
      #   contrast failures that the palette check could not, because it
      #   measures composited pixels rather than token pairs.
      #
      #   Headers — the CSP is the one header that can break the site silently.
      #   It loads every route in a real browser and fails on any violation,
      #   which is the only way to know a policy nobody tested actually works.
      # Every browser gate below drives Chrome over CDP. The runner image is
      # expected to ship it, but "expected to" is how a whole step fails with a
      # message about a socket rather than about a missing browser. This states
      # it plainly and exports the path scripts/lib/cdp.mjs looks for first.
      - name: Locate Chrome
        run: |
          for candidate in \
            /usr/bin/google-chrome \
            /usr/bin/google-chrome-stable \
            /usr/bin/chromium-browser \
            /usr/bin/chromium; do
            if [ -x "$candidate" ]; then
              echo "CHROME_PATH=$candidate" >> "$GITHUB_ENV"
              echo "Using $candidate"
              "$candidate" --version || true
              exit 0
            fi
          done
          echo "::error::No Chrome or Chromium on this runner. The browser gates cannot run."
          exit 1

      - name: Browser QA (overflow, motion, hero, a11y, headers)
        run: |
          node scripts/serve-dist.mjs 4399 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:4399/ >/dev/null && break
            sleep 1
          done
          npm run check:overflow -- http://localhost:4399
          npm run check:motion -- http://localhost:4399
          npm run check:hero -- http://localhost:4399
          npm run check:a11y -- http://localhost:4399
          npm run check:headers -- http://localhost:4399
