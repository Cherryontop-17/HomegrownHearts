name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, format, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches missing Spanish translations: `es` is typed as
      # Record<UIKey, string>, so an omitted key fails here.
      - name: Type-check
        run: npm run check

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
