# The Garden — the planting calendar and what grows in it.
#
# This page exists because the homepage was 17,000px long and the calendar sat
# seven sections down it, where nobody found it. Detail belongs on its own
# route; the homepage links here.
#
# WARNING: Section ids are load-bearing. ContentPage.astro renders `roadmap` as
# the calendar and `crops` as the grow chart, both keyed by id, and src/copy.ts
# fails the build if the Spanish file does not carry the same set.
#
# WARNING: Phase `key` values join to ROADMAP in src/config.ts, which holds the
# real dates. Adding a phase here without adding its key there is a build error.
# `value` is the display label and IS translated; the dates are not, so the two
# languages cannot drift to different months.

title: The garden calendar
description: What Homegrown Hearts plants and harvests each month in Union County, North Carolina, from August 2026 to June 2027.

hero:
  eyebrow: The Garden
  title: What is in the ground, and when.
  lead: >-
    Eleven months, seven crops, and one delivery schedule. Everything went in on
    August 12. Page through the months to see what happens when.

sections:
  # ── Where we grow ──────────────────────────────────────────────────────────
  # ⚠️ This whole section is hidden until a garden site sets `confirmed: true`
  # in src/config.ts — COMPLIANCE Rule 4 by analogy: a location is not ours to
  # announce until the people who own it have agreed. ContentPage.astro drops
  # the band, heading and all, while none have.
  #
  # The wording must stay true for one site or for several, because which of
  # them says yes first is not knowable from here. Nothing below counts them,
  # and no candidate is named.
  - id: garden-sites
    eyebrow: Where we grow
    title: A patch of ground, lent to us.
    body:
      - >-
        We do not own land. Everything in the calendar above grows on ground a
        community garden agreed to share with two students who asked. That is
        the whole arrangement, and we are grateful for it.
  # ── Roadmap ────────────────────────────────────────────────────────────────
  # `key` on each item joins it to ROADMAP in src/config.ts, which holds the
  # real dates. `value` is the display label and is translated; the dates are
  # not, so English and Spanish cannot drift to different Augusts.
  - id: roadmap
    eyebrow: The plan
    title: One planting day, then eleven months of cutting.
    body:
      - >-
        All seven went into the beds on August 12, on three different clocks.
        The basil is cutting three weeks later, the oregano takes six weeks to
        get going, and four of the seven are still in the ground the following
        spring. That spread is what keeps the delivery schedule from having a
        hole in the middle of it.
    items:
      - key: digital
        value: Aug 7-8
        icon: qr-code
        title: Digital launch
        body: >-
          This site, the volunteer intake, and the bag-tag system go live before
          anything is planted, so the tracking exists from the first harvest
          rather than being added later.
      - key: garden
        value: Aug 9-11
        icon: shovel
        title: Garden site opens
        body: >-
          Beds go in. We are in discussion with community gardens in Union
          County and will name the site here once it is settled.
      - key: planting
        value: Aug 12
        icon: sprout
        title: Planting day
        body: >-
          Kale, spinach, sweet basil, peppermint, cilantro, oregano and dill all
          went in on the same day. The basil, peppermint and oregano as nursery
          plants; the greens, cilantro and dill from seed.
      - key: establish
        value: Aug 13-31
        icon: droplets
        title: Rooting in
        body: >-
          Nothing to pick. The transplants put roots down and the seed comes up,
          and the whole job for three weeks is water, in the heat, every day.
      - key: sep-first
        value: Sep 1-10
        icon: leafy-green
        title: First cuts
        body: >-
          Basil is ready about three weeks after planting and baby kale a few
          days behind it. The first thing out of these beds is a handful of
          herbs, not a full bundle.
      - key: sep-herbs
        value: Sep 11-20
        icon: leaf
        title: The herbs fill in
        body: >-
          Peppermint and cilantro are big enough to cut from. Pinching the basil
          tips keeps it bushing out instead of running to flower.
      - key: sep-delivery
        value: Sep 21-30
        icon: truck
        title: First deliveries
        body: >-
          Spinach and dill reach cutting size, which is the point where a bundle
          holds enough to be worth the drive. The first bundles go to our
          partner clinic.
      - key: oct-peak
        value: Oct 1-18
        icon: basket
        title: Everything producing at once
        body: >-
          All seven are cutting, the oregano included. Peak month for variety,
          and the first stretch where a bundle a week is routine rather than an
          experiment.
      - key: oct-basil
        value: Oct 19-31
        icon: flower-2
        title: The last of the basil
        body: >-
          Basil stops once the nights turn cold and blackens at the first frost,
          so it is cut hard while it is still good. Everything else keeps going.
      - key: nov-frost
        value: Nov 1-15
        icon: snowflake
        title: First frost
        body: >-
          The basil is finished. Kale, spinach, cilantro and dill take a light
          frost without flinching, and kale tastes sweeter after one.
      - key: nov-cover
        value: Nov 16-30
        icon: shovel
        title: Row cover goes on
        body: >-
          Frost cloth over the greens so they keep producing through the cold.
          The peppermint and oregano die back to the roots, which is what they
          are supposed to do — they come back in March.
      - key: dec-slow
        value: December
        icon: snowflake
        title: Slow winter cutting
        body: >-
          Under cover, kale and spinach keep making leaves, just slowly. Bundles
          get smaller and less frequent, and we say so rather than promising a
          weekly delivery we cannot make in December.
      - key: jan-plan
        value: January
        icon: clipboard-list
        title: The cold weeks, and the spring plan
        body: >-
          Almost nothing grows. We sit down with our partner clinic, go through
          what the autumn actually produced, and agree what may go in for spring
          before we order a seed.
      - key: feb-wake
        value: February
        icon: sun
        title: The beds wake up
        body: >-
          Lengthening days restart the overwintered kale and spinach. Covers
          come off on mild days and go back on at night.
      - key: mar-sow
        value: Mar 1-15
        icon: sprout
        title: Spring sowing
        body: >-
          Fresh cilantro, dill and spinach go into the ground. The overwintered
          plants will run to flower as it warms, so the spring round is sown
          before that happens rather than after.
      - key: mar-return
        value: Mar 16-31
        icon: leaf
        title: The perennials come back
        body: >-
          Peppermint and oregano push new shoots out of the roots they wintered
          on. Nothing was replanted; they are the same plants that went in last
          August.
      - key: apr-spring
        value: Apr 1-15
        icon: leafy-green
        title: Spring greens peak
        body: >-
          Kale and spinach are at their best of the whole season, and the March
          sowing is coming up behind them. The heaviest bundles of the year.
      - key: apr-basil
        value: Apr 16-30
        icon: flower-2
        title: Basil goes back in
        body: >-
          Basil is the one thing that has to be replanted, and it cannot go in
          until the last frost has passed. New plants in, three weeks to the
          first cut.
      - key: may-bolt
        value: May 1-15
        icon: sun
        title: The greens bolt
        body: >-
          Heat and long days send the overwintered kale, spinach and cilantro to
          flower. They come out of the beds, and the herbs carry the bundles
          from here.
      - key: may-herbs
        value: May 16-31
        icon: leaf
        title: Herb season
        body: >-
          Basil, peppermint, oregano and the spring dill all cutting at once.
          Lighter bundles than April, and the most aromatic of the year.
      - key: jun-last
        value: Jun 1-20
        icon: truck
        title: Final deliveries
        body: >-
          The last bundles of the first season. The perennials stay in the
          ground — they are the head start the second season begins with.
      - key: jun-review
        value: Jun 21-30
        icon: clipboard-list
        title: Season review with the clinic
        body: >-
          We sit down with our partner clinic, go through what worked across the
          whole year, and agree the list for the second season before we order a
          seed.

  # ── Crop detail ────────────────────────────────────────────────────────────
  # Feeds the grow chart's expandable panels. `key` joins each entry to
  # src/crops.ts, which holds the day counts.
  #
  # ⚠️ COMPLIANCE Rule 1, and this is the section most likely to breach it.
  # Every line here describes HOW THE PLANT GROWS or WHAT A KITCHEN DOES WITH
  # IT. Nothing describes what eating it does to a person. No nutrients, no
  # "good for", no "helps with" — not even with a citation attached, because a
  # citation does not launder a health claim. docs/CROPS.md explains why, and
  # describes the one legitimate route to publishing nutrition content.
  - id: crops
    eyebrow: What is in the ground
    title: Five herbs, two greens, one planting day.
    body:
      - >-
        Click any crop for how long it takes, when it is ready, and what to do
        with it in a kitchen. The bars are drawn from real days-to-maturity, so
        you can see for yourself where the harvests actually land.
    items:
      - key: basil
        title: Sweet basil
        body: >-
          Went in as a nursery plant rather than seed, which is what let an
          August planting reach a September delivery. Pinch the growing tips and
          it bushes out instead of running to flower.
        details:
          - label: Ready when
            value: The plant has several sets of true leaves and stands about a hand tall.
          - label: How to pick
            value: Cut whole stems above a leaf pair, never strip single leaves.
          - label: Keeping it
            value: Stems in a glass of water on the counter. Never the fridge, which blackens it.
          - label: In the kitchen
            value: Torn over anything hot at the last second. Heat drives off the aroma.
      - key: kale
        title: Kale
        body: >-
          The workhorse, and one of the two things here that is not an herb. Cut
          at baby-leaf size for the first harvest and the same plant keeps
          producing straight through the winter.
        details:
          - label: Ready when
            value: Leaves are the size of your palm for baby leaf, a hand span for full size.
          - label: How to pick
            value: Outer leaves first, always leaving the growing center intact.
          - label: Keeping it
            value: Loosely bagged in the fridge, about a week.
          - label: In the kitchen
            value: Stems removed, leaves shredded. Holds up to long cooking better than spinach.
      - key: peppermint
        title: Peppermint
        body: >-
          A perennial that dies back in the cold and comes up from the same
          roots in spring. It spreads by runners, so it is grown in its own
          container sunk in the bed rather than loose among everything else.
        details:
          - label: Ready when
            value: Stems are six inches or so and the leaves smell strongly when rubbed.
          - label: How to pick
            value: Cut a stem above a leaf pair. It branches from the cut and comes back thicker.
          - label: Keeping it
            value: Stems in water on the counter, or loosely bagged in the fridge for a few days.
          - label: In the kitchen
            value: Torn into cold water, salads, yoghurt, or steeped in hot water on its own.
      - key: cilantro
        title: Cilantro
        body: >-
          Sown straight into the bed, because it puts down a taproot and runs to
          flower if that gets disturbed. Cool weather is what keeps it in leaf.
        details:
          - label: Ready when
            value: The plant is about six inches tall with broad, flat lower leaves.
          - label: How to pick
            value: Outer stems at the base, leaving the center. Cut the whole plant once it starts to flower.
          - label: Keeping it
            value: Stems in a jar of water, a bag over the top, in the fridge. About a week.
          - label: In the kitchen
            value: Raw and added at the end. Stems chopped fine are as good as the leaves.
      - key: spinach
        title: Spinach
        body: >-
          A cool-season crop, so an August sowing here is at the hot edge of its
          range. It comes into its own once the nights cool off, and carries on
          under cover all winter.
        details:
          - label: Ready when
            value: Leaves are big enough to pick without tearing the crown.
          - label: How to pick
            value: Outer leaves, or cut the whole plant at the base.
          - label: Keeping it
            value: Dry, loosely bagged, in the fridge. Wilts faster than kale.
          - label: In the kitchen
            value: Raw when small, wilted in a hot pan when larger. Cooks down to almost nothing.
      - key: dill
        title: Dill
        body: >-
          Direct-sown for the same taproot reason as the cilantro. The feathery
          leaf is what goes in a bundle; left alone the plant runs up to a
          flower head and sets seed.
        details:
          - label: Ready when
            value: The plant has four or five feathery fronds and stands about a hand tall.
          - label: How to pick
            value: Snip whole fronds from the outside. Never strip a plant bare.
          - label: Keeping it
            value: Loosely bagged in the fridge. Two or three days at its best, so it goes out fresh.
          - label: In the kitchen
            value: Raw over potatoes, eggs, cucumber or fish. Stirred in off the heat.
      - key: oregano
        title: Oregano
        body: >-
          The slowest to get going and the longest-lived: six weeks before the
          first cut, and then the same plant is still there the following
          spring.
        details:
          - label: Ready when
            value: The plant is four or five inches across and woody at the base of the stems.
          - label: How to pick
            value: Cut stems back by a third, above a leaf pair. Never more than a third at once.
          - label: Keeping it
            value: Fresh in a bag in the fridge for a week, or hung in a bunch somewhere dry.
          - label: In the kitchen
            value: Goes in early rather than late. It is one of the few that takes long cooking.
