# Homepage. Answers "what do you do and who do you serve" in the first screen —
# the fresh-eyes 10-second test in docs/BRIEF.md §4.
#
# North Carolina is named in full in the hero, the meta description, and the
# founders section: a reader arriving from a search or a shared link should not
# have to decode "NC", and a clinic staffer should see immediately that we are
# local to them rather than a national organization.
#
# Statistics come from docs/SOURCES.md and are access/consumption facts only.
# Never a health outcome. See docs/COMPLIANCE.md Rule 1.
#
# ⚠️ Section ids here are load-bearing. HomePage.astro looks each one up by id
# and throws if it is missing, and src/copy.ts fails the build if the Spanish
# file does not carry the same set. Renaming one means renaming it in three
# places.

title: Fresh food for new mothers
description: Homegrown Hearts grows herbs in Union County, North Carolina and delivers free seasonal bundles to pregnant and postpartum mothers through a partner clinic.

hero:
  eyebrow: Union County, North Carolina
  title: Fresh food, grown close to home.
  lead: >-
    We grow herbs in a small garden in Union County, North Carolina and pack them
    into free bundles for pregnant and postpartum mothers. A partner clinic hands
    them to the families it serves.
  ctas:
    - label: Partner with us
      href: /partners
      primary: true
    # Straight to the form. Every "volunteer" link on the site ends there.
    - label: Volunteer with us
      href: /get-involved/volunteer#signup

sections:
  # ── Safety gate ────────────────────────────────────────────────────────────
  # The credibility section. A clinic reading this site is looking for exactly
  # one thing: evidence that two students are not making clinical decisions.
  # Each item names who owns a decision, and none of them is us.
  - id: safety
    eyebrow: How this stays safe
    title: The decisions that matter are not ours to make.
    body:
      - >-
        We are two high school students. We grow herbs and we drive them to
        a clinic. Everything past that point belongs to people qualified to
        decide it, and the program is built so it stays that way.
    items:
      # ⚠️ Written so it is true BEFORE the clinic signs off and still true
      # after. It previously read "A clinic-approved produce list / Our partner
      # clinic reviewed and approved every item", which was a claim about a
      # thing that had not happened — while the founders' own email to the
      # clinic asked for exactly that approval. Clinic staff read this site.
      # Do not restore the past tense until the sign-off is actually in hand.
      - icon: file-check
        title: The clinic decides what we may grow
        body: >-
          Our partner clinic reviews the list of everything we propose to grow
          and pack, and nothing goes in the ground until they have signed it
          off. Nothing goes into a bundle that is not on that list.
      - icon: user-check
        title: An adult advisor
        body: >-
          An adult advisor supervises the program and signs off on what we
          deliver. Nothing goes out without them.
      - icon: shield-check
        title: Whole, raw, washed in plain water
        body: >-
          We do not cut, cook, or preserve anything. Bundles are packed the
          morning they leave and handed straight to the clinic.
      - icon: truck
        title: The clinic decides who receives
        body: >-
          We never meet a recipient and we never hold a name. Our partner hands
          the bundles to the families it serves.
    note: >-
      We describe the food and nothing else. For guidance on eating during
      pregnancy, ask your clinician.

  - id: why
    eyebrow: Why herbs
    title: Fresh herbs are the first thing a tight budget gives up.
    body:
      - >-
        They cost a lot for how little you get, and a bunch wilts in the fridge
        within days. When money is short they are the first thing to go, and a
        meal made without them is the meal that gets made. That is why a free
        bag of them, already washed, is worth more than it looks.
    items:
      - value: '1 in 10'
        title: adults eat the recommended amount of vegetables
        body: About 1 in 15 among adults living near the poverty line.
        source: CDC, MMWR 2022
        sourceHref: https://www.cdc.gov/mmwr/volumes/71/wr/mm7101a1.htm
      - value: '18.4%'
        title: of US households with children faced food insecurity in 2024
        source: USDA ERS, 2025
        sourceHref: https://ers.usda.gov/sites/default/files/_laserfiche/publications/113623/ERR-358.pdf
      - value: '11.1%'
        title: of people in Union County, North Carolina face food insecurity
        body: Lower than most of the state. Still roughly 1 in 9 of our neighbors.
        source: Feeding America, Map the Meal Gap 2025
        sourceHref: https://map.feedingamerica.org/
    note: >-
      These are figures about what people can buy and eat. We make no claims
      about health. For guidance on eating during pregnancy, ask your clinician.

  - id: how
    eyebrow: How it works
    title: From our garden to a clinic waiting room.
    items:
      - icon: seed
        title: Grow
        body: >-
          We plant and tend a small garden through the North Carolina
          growing season.
      - icon: sprout
        title: Harvest
        body: Herbs are cut in the cool of the morning they go out.
      - icon: basket
        title: Pack
        body: >-
          Washed in plain running water, packed into clean bags with a card
          listing what is inside.
      - icon: heart
        title: Deliver
        body: >-
          Our partner clinic receives the bundles and hands them to the families
          it serves.

  - id: bundle
    eyebrow: What is in a bundle
    title: Whatever the garden feels like giving us.
    body:
      - >-
        A bundle is not a fixed box. It holds what the garden actually produced
        that week: sweet basil, peppermint, cilantro, oregano and dill, with
        kale and spinach alongside them, all grown locally. What is cutting
        changes with the month.
      - >-
        Everything is whole and raw. We do not cut, cook, or preserve anything.
    note: >-
      Every item we grow comes from the produce list our partner clinic signs
      off before we plant.

  # ── The QR pipeline ────────────────────────────────────────────────────────
  # ⚠️ COMPLIANCE Rule 1. Read the header of src/components/SmartRecipe.astro
  # before editing a word of this. The tool responds to the herbs on the
  # tag and to nothing about the person holding the bag. Any rewrite that makes
  # the recipes sound tailored to a reader turns this into dietary advice.
  - id: smart
    eyebrow: In every bundle
    title: A tag that tells you what to do with it.
    body:
      - >-
        A bag of unfamiliar herbs is a bag that sits in the drawer. Every
        bundle carries a tag listing what went in that morning, and scanning it
        opens plain ways to cook those specific herbs.
      - >-
        The tag knows what is in the bag. That is all it knows, and all it needs
        to know.
    items:
      - icon: basket
        title: We pack the bag
        body: The tag lists what went in that morning.
      - icon: scan-line
        title: You scan the tag
        body: Nothing to install. It opens in a browser.
      - icon: sparkles
        title: It reads that list
        body: The herbs on the tag are the only input.
      - icon: leafy-green
        title: You get ways to cook them
        body: >-
          Straightforward methods for what is in front of you, using what your
          kitchen already has.

  # ── Season targets ─────────────────────────────────────────────────────────
  # ⚠️ COMPLIANCE Rule 5. The numbers live in GOALS in src/config.ts and are
  # rendered only through <GoalMeter>, which prints the live actual from IMPACT
  # beside each one. Do not restate a target as prose here.
  - id: goals
    eyebrow: What we are aiming for
    title: Our targets for the first season.
    body:
      - >-
        The beds went in on August 12 and nothing has been weighed or delivered
        yet, so today every one of these sits at zero. We would rather show you
        the plan with the real number next to it than a figure you have no way
        to check.

  # ── Supply wishlist ────────────────────────────────────────────────────────
  # `group` drives the filter chips and is translated. Order here is the order
  # of the chips, so keep produce first — it is the list most donors want.
  - id: wishlist
    eyebrow: Donate supplies
    title: Things we would genuinely be thrilled to receive.
    body:
      - >-
        Supplies only, never money. If you are standing in a garden center or a
        hardware store and want to help, this is the whole list.
    items:
      # ⚠️ Quantities for peppermint, cilantro, oregano and dill are placeholders
      # added when the crop list changed on 2026-09-21. Correct them to what the
      # beds actually need.
      - group: Seeds and seedlings
        icon: flower-2
        title: Sweet basil
        value: 6 plants
        body: Fast-cycle. First thing ready to harvest, and replanted every spring.
      - group: Seeds and seedlings
        icon: leafy-green
        title: Kale
        value: 1 packet
        body: Fast-cycle and keeps producing after cutting.
      - group: Seeds and seedlings
        icon: leaf
        title: Peppermint
        value: 2 plants
        body: Plants only. Peppermint does not come true from seed.
      - group: Seeds and seedlings
        icon: clover
        title: Cilantro
        value: 1 packet
        body: Sown straight into the bed, in autumn and again in spring.
      - group: Seeds and seedlings
        icon: salad
        title: Spinach
        value: 1 packet
        body: Cool-season. Overwinters under cover.
      - group: Seeds and seedlings
        icon: wheat
        title: Dill
        value: 1 packet
        body: Sown straight into the bed, like the cilantro.
      - group: Seeds and seedlings
        icon: shrub
        title: Oregano
        value: 2 plants
        body: A perennial. Plant it once and it comes back every spring.
      - group: Tools
        icon: shovel
        title: Hand trowels and pruners
        value: 2 each
        body: The two tools we run out of on a packing morning.
      - group: Tools
        icon: droplets
        title: Watering can or hose
        value: Any
        body: Used every single day the sun is out.
      - group: Tools
        icon: shovel
        title: Garden gloves
        value: 4 pairs
        body: Adult small and medium.
      - group: Packing
        icon: package
        title: Cardboard boxes
        value: Any
        body: Clean and unused, for moving bundles to the clinic.
      - group: Packing
        icon: basket
        title: Clean paper bags
        value: Any
        body: One bundle per bag. Unused only.
    note: >-
      We accept donated supplies only, never money. Homegrown Hearts is a
      student-led initiative, and donations are not tax-deductible.

  # ── Flyers ─────────────────────────────────────────────────────────────────
  # This section only renders if there are image files in src/assets/flyers/.
  # It stays declared in both languages regardless, because src/copy.ts checks
  # that the two files carry the same set of section ids.
  - id: flyers
    eyebrow: Print and share
    title: Our flyers.
    body:
      - >-
        Print one for a break room, a church noticeboard, or a clinic waiting
        room. Everything on them is also written on this site.

  # ── About ──────────────────────────────────────────────────────────────────
  # Folded in from the old /about page. The header's "About" item is an anchor
  # to this section, so the id is load-bearing for navigation as well as for
  # HomePage.astro's lookup.
  # ── About ──────────────────────────────────────────────────────────────────
  # Folded in from the old /about page. The header's "About" item is an anchor
  # to this section, so the id is load-bearing for navigation as well as for
  # HomePage.astro's lookup.
  # ── About the organisation ─────────────────────────────────────────────────
  # The header's "About" item anchors here. It answers "what IS this", not
  # "who runs it" — the people have their own section directly below.
  - id: about
    eyebrow: About us
    title: A student garden with a clinic at the end of it.
    body:
      - >-
        Homegrown Hearts grows herbs in Union County, North Carolina and
        gives them away. Everything we harvest goes to one partner clinic, which
        hands it to the families it already serves. We never charge anyone, and
        we never decide who receives.
      - >-
        It is an unincorporated student-led initiative with no bank account, and
        donations are not tax-deductible. An adult advisor supervises what we
        grow, how we handle it, and what we deliver.
    items:
      - icon: sprout
        title: Started in 2026
        body: >-
          Two high school students, one growing season, and a produce list our
          partner clinic signs off before anything goes in the ground.
      - icon: map-pin
        title: Union County, North Carolina
        body: >-
          Everything is grown, packed, and delivered inside the county. Nothing
          is shipped and nothing is bought in.
      - icon: user-check
        title: Supervised by an adult advisor
        body: >-
          Available to any partner who wants to speak with them directly, before
          a first delivery or at any point after.
    note: >-
      We accept donated supplies only, and never money from anyone for anything.

  - id: founders
    eyebrow: Who runs it
    title: The two of us.
    items:
      - title: Kreeshma Vasikarla
        body: >-
          Mission and medical lead. Runs clinic outreach, the produce list, and
          the food-safety protocol.
      - title: Charishya Yarram
        body: >-
          Operations and technology lead. Runs growing schedules, logistics, the
          bag-tag system, and this site.

  - id: news
    eyebrow: Big news!
    title: Our first distribution is done!
    body:
      - >-
        On November 4, eleven bundles went to our partner clinic, and on to
        eleven mothers. We don't show the distribution itself, because the
        mothers' privacy comes first. Instead, here is what went into it: kale
        from our first harvest, and some of the finished bundles.

  - id: impact
    eyebrow: Our impact
    title: Where we are today.
    body:
      - >-
        We are just getting started, so these numbers are small. We would rather
        publish them honestly than round them up.

  - id: cta
    eyebrow: Get involved
    title: Three ways to help.
    items:
      - icon: users
        title: Volunteer
        body: Growing, harvesting, packing, and driving. No experience needed.
      - icon: basket
        title: Donate supplies
        body: >-
          Seeds, seedlings, tools, soil, and clean bags. Supplies only, never
          money.
      - icon: heart
        title: Partner with us
        body: >-
          If you work at a clinic or pregnancy center in or near Union County,
          North Carolina, we would like to talk.
    ctas:
      - label: Get involved
        href: /get-involved
        primary: true
      - label: For clinics
        href: /partners
