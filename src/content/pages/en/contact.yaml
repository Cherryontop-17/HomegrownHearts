title: Contact
description: Get in touch with Homegrown Hearts in Union County, North Carolina. One shared inbox reaches both founders, and we answer within two to three days.

hero:
  eyebrow: Contact
  title: Get in touch.
  lead: >-
    One shared inbox reaches both of us. We answer within two to three days.

sections:
  - id: reach
    eyebrow: Email
    title: Who you will hear from.
    body:
      - >-
        Write to the one address below and it reaches both of us. Kreeshma
        picks up anything to do with clinics and the produce list; Charishya
        takes volunteering, supplies, and this website. You do not need to work
        out which — whoever it belongs to will answer.
    items:
      - title: Kreeshma Vasikarla
        body: Mission and medical lead. Clinic partnerships and the produce list.
      - title: Charishya Yarram
        body: Operations and technology lead. Volunteers, supplies, logistics.

  - id: expectations
    eyebrow: What to expect
    title: How we handle enquiries.
    body:
      - >-
        We are students, so we answer in the evenings. Two to three days is
        normal. If a clinic writes to us, we will reply the same week.
      - >-
        We publish one shared project inbox rather than personal contact details,
        because both founders are minors.

  - id: privacy
    eyebrow: Privacy
    title: What we do with what you send.
    body:
      - >-
        Write to us as freely as you like. We respect everyone's privacy, so
        your message stays between you and the two of us.
