title: Our impact
description: Honest numbers from Homegrown Hearts in Union County, North Carolina, updated by hand after every delivery. Zeros included.

hero:
  eyebrow: Our impact
  title: The numbers, as they are.
  lead: >-
    Updated by hand after every delivery. When they are small, they will say so.

sections:
  - id: numbers
    eyebrow: To date
    title: Where we are today.
    body:
      - >-
        We are just getting started. These figures are low because the work is
        new, and rounding them up would be the fastest way to lose a partner who
        checked.

  - id: method
    eyebrow: How we count
    title: What each number means.
    items:
      - title: Bundles delivered
        body: >-
          One bundle is one bag handed to our partner clinic. We count bags, not
          pounds.
      - title: Mothers served
        body: >-
          Reported to us by the clinic as a count only. We never receive names or
          any other detail.
      - title: Volunteers
        body: People who have worked at least one shift with us.

  - id: updates
    eyebrow: Updates
    title: What has happened lately.
    body:
      - >-
        Delivery notes will appear here as they happen — what was in season, how
        much went out, what we learned.
