title: About us
description: Homegrown Hearts is a student-led initiative in Waxhaw, Union County, North Carolina, growing free produce bundles for mothers through a partner clinic.

hero:
  eyebrow: About
  title: A garden, two students, and a clinic.
  lead: >-
    Homegrown Hearts started in Waxhaw, North Carolina, with a simple idea: grow
    vegetables and give them to families who could use them, through people who
    already know who those families are.

sections:
  - id: mission
    eyebrow: What we do
    title: We grow food and give it away.
    body:
      - >-
        We tend a small garden through the North Carolina growing season, pick
        vegetables the morning they go out, wash and pack them, and deliver them
        to a partner clinic. The clinic decides who receives them.
      - >-
        We are not a food bank and not a delivery service. We grow a modest
        amount of food well and hand it to people better placed than us to get it
        where it should go.

  - id: founders
    eyebrow: Founders
    title: Who runs this.
    items:
      - title: Kreeshma Vasikarla — Mission and Medical Lead
        body: >-
          Leads clinic outreach, the produce list, and the food-safety protocol.
          Kreeshma is the one who will be in touch if you work at a clinic.
      - title: Charishya Yarram — Operations and Technology Lead
        body: >-
          Runs the growing schedule, volunteer logistics, delivery routes, and
          this website.

  - id: advisor
    eyebrow: Supervision
    title: We work under an adult advisor.
    body:
      - >-
        Both founders are high-school students. An adult advisor supervises what
        we grow, how we handle it, and what we deliver, and is available to any
        partner who wants to speak with them.

  - id: status
    eyebrow: Status
    title: What we are, precisely.
    body:
      - >-
        Homegrown Hearts is an unincorporated student-led initiative. It has no
        tax-exempt status and no bank account.
      - >-
        We accept donated supplies only. We do not accept money from anyone, for
        anything. If you would like to help materially, the supplies list on Get
        Involved is the way.

  - id: timeline
    eyebrow: Where we are
    title: Early, and saying so.
    body:
      - >-
        The garden is planted, the food-safety protocol is written, and we are
        talking to clinics in and around Union County, North Carolina. Our first
        deliveries have not happened yet.
      - >-
        We would rather a partner read that here than discover it in a meeting.
