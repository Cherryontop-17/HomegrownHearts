# Recetas con IA — la herramienta detrás del código QR de cada paquete.
#
# ⚠️ Esta página describe algo que TODAVÍA NO EXISTE, y lo dice en la primera
# línea. La Regla 5 habla de cifras, pero su principio cubre también las
# funciones: describir como viva una función que no está construida es el mismo
# fallo que inflar una cifra de impacto.
#
# ⚠️ La Regla 1 manda en cada palabra sobre lo que devuelve la herramienta.
# Responde a las verduras de la bolsa y a nada sobre quien la recibe. Sin
# nutrientes, sin «bueno para», sin personalizar por embarazo.

title: Recetas con IA
description: La herramienta detrás del código QR de cada paquete de Homegrown Hearts. Sugiere formas de cocinar las verduras de la bolsa. Todavía en desarrollo.

hero:
  eyebrow: En desarrollo
  title: Todavía no está lista. Esto es lo que hará.
  lead: >-
    Cada paquete llevará una etiqueta que se puede escanear. Esta página explica
    qué pasa cuando lo haga, y seguirá marcada como sin terminar hasta que la
    herramienta funcione de verdad.

sections:
  - id: status
    eyebrow: En qué punto está
    title: Vuelva más adelante.
    body:
      - >-
        Estamos construyendo esto después del huerto, no antes. Las primeras
        entregas importan más que el software que las acompaña, así que el
        sistema de etiquetas sale cuando ya haya verduras a las que pegarlas.
      - >-
        Nada de esta página está activo. Todavía no hay ningún código que
        escanear, y la vista previa de la página principal es una ilustración,
        no una etiqueta funcional.
    ctas:
      - label: Vea cómo funcionará
        href: /#smart
        primary: true
      - label: Díganos qué le serviría
        href: /contact

  - id: plan
    eyebrow: La idea
    title: Una etiqueta que sabe qué hay en la bolsa.
    items:
      - icon: basket
        title: Se empaca la bolsa
        body: >-
          Lo que salió del huerto esa mañana queda escrito en la etiqueta cuando
          se arma el paquete.
      - icon: scan-line
        title: Se escanea la etiqueta
        body: >-
          La cámara del teléfono la abre en el navegador. No hay que instalar
          nada, ni crear cuenta, ni registrarse.
      - icon: sparkles
        title: Se lee esa lista
        body: >-
          Las verduras de la etiqueta son el único dato de entrada. A la
          herramienta se le dice qué hay en la bolsa y absolutamente nada sobre
          quién la recibe.
      - icon: leafy-green
        title: Aparecen formas de cocinarlas
        body: >-
          Métodos sencillos para esas verduras concretas, con lo que ya hay en
          una cocina de casa.
    note: >-
      Ideas para cocinar las verduras del paquete. No es asesoría dietética ni
      médica. Para orientación sobre la alimentación durante el embarazo,
      consulte a su profesional clínico.

  - id: why
    eyebrow: Por qué importa
    title: Una verdura desconocida es una verdura desperdiciada.
    body:
      - >-
        La razón más común por la que una bolsa gratuita de verduras no se come
        no es que nadie la quisiera. Es que apareció una verdura que nadie en la
        casa había cocinado antes, y se quedó en el cajón hasta pasarse.
      - >-
        Una etiqueta en la bolsa es la respuesta más barata posible a eso, y es
        la única parte de este proyecto donde un programa ayuda de verdad.
