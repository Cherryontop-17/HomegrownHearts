# Página principal — español.
#
# Registro: español latinoamericano, lenguaje sencillo, forma «usted».
# Traducido por sentido, nunca palabra por palabra.
#
# Trampas evitadas (docs/COMPLIANCE.md, regla 6):
#   - «saludable» / «nutritivo» se acercan demasiado a una afirmación de salud.
#     Se usa «fresco», «de temporada», «recién cosechado».
#   - «ayudar a» es una afirmación de salud en cuanto toca un cuerpo.
#     «ayudar a las familias» sí; «ayudar a su embarazo» jamás.
#
# ⚠️ Los ids de sección deben coincidir exactamente con los del archivo en
# inglés. src/copy.ts detiene la compilación si falta uno o si sobra otro.

title: Alimentos frescos para nuevas madres
description: Cultivamos hierbas aromáticas en el condado de Union, Carolina del Norte, y entregamos paquetes gratuitos de temporada a madres embarazadas y recién dadas a luz.

hero:
  eyebrow: Condado de Union, Carolina del Norte
  title: Alimentos frescos, cultivados aquí cerca.
  lead: >-
    Cultivamos hierbas aromáticas en un huerto pequeño en el condado de Union, Carolina del Norte, y
    armamos paquetes gratuitos para madres embarazadas y recién dadas a luz. Una
    clínica asociada los entrega a las familias que atiende.
  ctas:
    - label: Colabore con nosotras
      href: /partners
      primary: true
    # Directo al formulario. Todos los enlaces de voluntariado terminan ahí.
    - label: Sea voluntario
      href: /get-involved/volunteer#signup

sections:
  # ── Garantías ──────────────────────────────────────────────────────────────
  # La sección de credibilidad. Una clínica que lee este sitio busca una sola
  # cosa: que dos estudiantes no estén tomando decisiones clínicas.
  - id: safety
    eyebrow: Cómo cuidamos el proceso
    title: Las decisiones importantes no nos corresponden a nosotras.
    body:
      - >-
        Somos dos estudiantes de secundaria. Cultivamos hierbas y las llevamos a
        una clínica. Todo lo que va más allá de eso queda en manos de personas
        con la formación para decidirlo, y el programa está armado para que siga
        siendo así.
    items:
      # ⚠️ Redactado para ser cierto ANTES de la aprobación de la clínica y
      # seguir siéndolo después. Antes decía que la clínica ya había revisado y
      # aprobado la lista, cuando el correo de las fundadoras pedía justamente
      # esa aprobación. El personal de la clínica lee este sitio. No volver al
      # pasado hasta tener la aprobación por escrito.
      - icon: file-check
        title: La clínica decide qué podemos cultivar
        body: >-
          Nuestra clínica asociada revisa la lista de todo lo que proponemos
          cultivar y empacar, y no sembramos nada hasta que la apruebe. No entra
          al paquete nada que no esté en esa lista.
      - icon: user-check
        title: Una persona adulta responsable
        body: >-
          Una persona adulta responsable supervisa el programa y autoriza lo que
          entregamos. Nada sale sin su visto bueno.
      - icon: shield-check
        title: Entero, crudo y lavado solo con agua
        body: >-
          No cortamos, no cocinamos y no conservamos nada. Los paquetes se
          empacan la misma mañana en que salen y van directo a la clínica.
      - icon: truck
        title: La clínica decide quién recibe
        body: >-
          Nunca conocemos a quien recibe un paquete y nunca guardamos un nombre.
          Nuestra clínica asociada los entrega a las familias que atiende.
    note: >-
      Describimos el alimento y nada más. Para orientación sobre la alimentación
      durante el embarazo, consulte a su profesional clínico.

  - id: why
    eyebrow: Por qué hierbas
    title: Las hierbas frescas son lo primero que se deja de comprar.
    body:
      - >-
        Cuestan mucho para lo poco que traen, y un manojo se marchita en el
        refrigerador en pocos días. Cuando el dinero no alcanza, son lo primero
        que se deja de comprar, y la comida se hace sin ellas. Por eso una bolsa
        gratuita, ya lavada, vale más de lo que parece.
    items:
      - value: '1 de cada 10'
        title: adultos come la cantidad de verduras recomendada
        body: >-
          Cerca de 1 de cada 15 entre quienes viven cerca del nivel de pobreza.
        source: CDC, MMWR 2022
        sourceHref: https://www.cdc.gov/mmwr/volumes/71/wr/mm7101a1.htm
      - value: '18.4%'
        title: >-
          de los hogares con niños en EE. UU. vivió inseguridad alimentaria en
          2024
        source: USDA ERS, 2025
        sourceHref: https://ers.usda.gov/sites/default/files/_laserfiche/publications/113623/ERR-358.pdf
      - value: '11.1%'
        title: >-
          de las personas del condado de Union, Carolina del Norte, vive
          inseguridad alimentaria
        body: >-
          Menos que en la mayor parte del estado. Aun así, casi 1 de cada 9
          vecinos nuestros.
        source: Feeding America, Map the Meal Gap 2025
        sourceHref: https://map.feedingamerica.org/
    note: >-
      Estas cifras hablan de lo que las personas pueden comprar y comer. No
      hacemos ninguna afirmación médica. Para orientación sobre la alimentación
      durante el embarazo, consulte a su profesional de salud.

  - id: how
    eyebrow: Cómo funciona
    title: De nuestro huerto a la sala de espera de la clínica.
    items:
      - icon: seed
        title: Sembrar
        body: >-
          Cuidamos un huerto pequeño durante toda la temporada de
          cultivo de Carolina del Norte.
      - icon: sprout
        title: Cosechar
        body: >-
          Cortamos las hierbas temprano, la misma mañana en que salen.
      - icon: basket
        title: Empacar
        body: >-
          Se lavan solo con agua corriente y se empacan en bolsas limpias, con
          una tarjeta que indica el contenido.
      - icon: heart
        title: Entregar
        body: >-
          La clínica asociada recibe los paquetes y los entrega a las familias
          que atiende.

  - id: bundle
    eyebrow: Qué trae un paquete
    title: Lo que el huerto quiera darnos esa semana.
    body:
      - >-
        El paquete no es una caja fija. Trae lo que el huerto dio esa semana:
        albahaca, menta piperita, cilantro, orégano y eneldo, con col rizada y
        espinaca al lado, todo cultivado aquí cerca. Lo que se está cortando
        cambia con el mes.
      - >-
        Todo va entero y crudo. No cortamos, no cocinamos y no conservamos nada.
    note: >-
      Todo lo que cultivamos sale de la lista de cultivos que nuestra clínica
      asociada aprueba antes de que sembremos.

  # ── El código QR ───────────────────────────────────────────────────────────
  # ⚠️ Regla 1 de COMPLIANCE. La herramienta responde a las hierbas de la
  # etiqueta y a nada sobre la persona que recibe la bolsa. Cualquier redacción
  # que haga sonar las recetas como personalizadas la convierte en asesoría
  # dietética.
  - id: smart
    eyebrow: En cada paquete
    title: Una etiqueta que le dice qué hacer con lo que recibió.
    body:
      - >-
        Una bolsa de hierbas desconocidas es una bolsa que se queda en el
        cajón. Cada paquete lleva una etiqueta con lo que se empacó esa mañana, y
        al escanearla aparecen formas sencillas de cocinar esas hierbas.
      - >-
        La etiqueta sabe qué hay en la bolsa. Eso es todo lo que sabe y todo lo
        que necesita saber.
    items:
      - icon: basket
        title: Nosotras empacamos
        body: La etiqueta indica lo que entró esa mañana.
      - icon: scan-line
        title: Usted escanea
        body: No hay que instalar nada. Se abre en el navegador.
      - icon: sparkles
        title: Se lee esa lista
        body: Las hierbas de la etiqueta son el único dato de entrada.
      - icon: leafy-green
        title: Aparecen formas de cocinarlas
        body: >-
          Métodos sencillos para lo que tiene enfrente, con lo que ya hay en su
          cocina.

  # ── Metas de temporada ─────────────────────────────────────────────────────
  # ⚠️ Regla 5 de COMPLIANCE. Las cifras están en GOALS en src/config.ts y solo
  # se muestran mediante <GoalMeter>, que imprime el dato real junto a cada meta.
  - id: goals
    eyebrow: Hacia dónde vamos
    title: Nuestras metas para la primera temporada.
    body:
      - >-
        Los canteros se sembraron el 12 de agosto y todavía no se ha pesado ni
        entregado nada, así que hoy todas estas cifras están en cero. Preferimos
        mostrarle el plan con el número real al lado antes que una cifra que
        usted no pueda verificar.

  # ── Lista de insumos ───────────────────────────────────────────────────────
  # `group` genera los filtros y sí se traduce. El orden aquí es el orden de los
  # filtros: las semillas van primero porque son lo que más se dona.
  - id: wishlist
    eyebrow: Done materiales
    title: Cosas que de verdad nos encantaría recibir.
    body:
      - >-
        Solo materiales, nunca dinero. Si está en un vivero o en una ferretería y
        quiere apoyar, esta es la lista completa.
    items:
      # ⚠️ Las cantidades de menta, cilantro, orégano y eneldo son provisionales
      # (cambio de lista del 2026-09-21). Corríjalas según lo que de verdad
      # necesiten los canteros, igual que en el archivo en inglés.
      - group: Semillas y plántulas
        icon: flower-2
        title: Albahaca
        value: 6 plantas
        body: Ciclo corto. Lo primero que se cosecha, y se vuelve a plantar cada primavera.
      - group: Semillas y plántulas
        icon: leafy-green
        title: Col rizada
        value: 1 sobre
        body: Ciclo corto y sigue produciendo después del corte.
      - group: Semillas y plántulas
        icon: leaf
        title: Menta piperita
        value: 2 plantas
        body: Solo plantas. La menta piperita no sale fiel de semilla.
      - group: Semillas y plántulas
        icon: clover
        title: Cilantro
        value: 1 sobre
        body: Se siembra directo en el cantero, en otoño y otra vez en primavera.
      - group: Semillas y plántulas
        icon: salad
        title: Espinaca
        value: 1 sobre
        body: Cultivo de clima fresco. Pasa el invierno bajo manta.
      - group: Semillas y plántulas
        icon: wheat
        title: Eneldo
        value: 1 sobre
        body: Se siembra directo en el cantero, como el cilantro.
      - group: Semillas y plántulas
        icon: shrub
        title: Orégano
        value: 2 plantas
        body: Es perenne. Se planta una vez y vuelve cada primavera.
      - group: Herramientas
        icon: shovel
        title: Palas de mano y tijeras de podar
        value: 2 de cada una
        body: Las dos herramientas que se nos acaban en una mañana de empaque.
      - group: Herramientas
        icon: droplets
        title: Regadera o manguera
        value: Cualquiera
        body: Se usa todos los días que hay sol.
      - group: Herramientas
        icon: shovel
        title: Guantes de jardinería
        value: 4 pares
        body: Talla adulto chica y mediana.
      - group: Empaque
        icon: package
        title: Cajas de cartón
        value: Cualquiera
        body: Limpias y sin usar, para llevar los paquetes a la clínica.
      - group: Empaque
        icon: basket
        title: Bolsas de papel limpias
        value: Cualquiera
        body: Un paquete por bolsa. Solo sin usar.
    note: >-
      Aceptamos únicamente materiales donados, nunca dinero. Homegrown Hearts es
      una iniciativa estudiantil sin cuenta bancaria y sin exención de impuestos.

  # ── Volantes ───────────────────────────────────────────────────────────────
  # Esta sección solo aparece si hay imágenes en src/assets/flyers/. Se declara
  # igual en ambos idiomas porque src/copy.ts compara los ids de sección.
  - id: flyers
    eyebrow: Imprima y comparta
    title: Nuestros volantes.
    body:
      - >-
        Imprima uno para una sala de descanso, un tablero de anuncios o una sala
        de espera. Todo lo que dicen está también escrito en este sitio.

  # ── Quiénes somos ──────────────────────────────────────────────────────────
  # Integrado desde la antigua página /about. El enlace «Quiénes somos» del
  # encabezado apunta a esta sección, así que el id también sirve de ancla.
  # ── Quiénes somos ──────────────────────────────────────────────────────────
  # Integrado desde la antigua página /about. El enlace «Quiénes somos» del
  # encabezado apunta a esta sección, así que el id también sirve de ancla.
  # ── Sobre la organización ──────────────────────────────────────────────────
  # El enlace «Quiénes somos» del encabezado ancla aquí. Responde qué ES esto,
  # no quién lo lleva: las personas tienen su propia sección justo debajo.
  - id: about
    eyebrow: Sobre nosotras
    title: Un huerto estudiantil con una clínica al final.
    body:
      - >-
        Homegrown Hearts cultiva hierbas aromáticas en el condado de Union, Carolina del
        Norte, y las regala. Todo lo que cosechamos va a una clínica asociada,
        que lo entrega a las familias que ya atiende. Nunca cobramos nada y nunca
        decidimos quién recibe.
      - >-
        Es una iniciativa estudiantil sin constituir y sin cuenta bancaria, y las
        donaciones no son deducibles de impuestos. Una persona adulta responsable
        supervisa qué cultivamos, cómo lo manejamos y qué entregamos.
    items:
      - icon: sprout
        title: Comenzó en 2026
        body: >-
          Dos estudiantes de secundaria, una temporada de cultivo y una lista de
          cultivos que nuestra clínica asociada aprueba antes de sembrar nada.
      - icon: map-pin
        title: Condado de Union, Carolina del Norte
        body: >-
          Todo se cultiva, se empaca y se entrega dentro del condado. No enviamos
          nada por paquetería ni compramos nada hecho.
      - icon: user-check
        title: Con supervisión de una persona adulta
        body: >-
          Disponible para cualquier institución que quiera hablar directamente
          con ella, antes de una primera entrega o en cualquier momento después.
    note: >-
      Aceptamos únicamente materiales donados, nunca dinero de nadie para nada.

  - id: founders
    eyebrow: Quiénes lo llevan
    title: Nosotras dos.
    items:
      - title: Kreeshma Vasikarla
        body: >-
          Responsable de misión y enlace médico. Coordina el contacto con
          clínicas, la lista de cultivos y el protocolo de inocuidad.
      - title: Charishya Yarram
        body: >-
          Responsable de operaciones y tecnología. Coordina los calendarios de
          cultivo, la logística, el sistema de etiquetas y este sitio.

  - id: news
    eyebrow: ¡Gran noticia!
    title: ¡Ya hicimos nuestra primera entrega!
    body:
      - >-
        El 4 de noviembre, once paquetes llegaron a nuestra clínica aliada, y
        de ahí a once madres. No mostramos la entrega en sí, porque la privacidad
        de las madres es lo primero. En su lugar, aquí está lo que la hizo
        posible: col rizada de nuestra primera cosecha y algunos de los
        paquetes terminados.

  - id: impact
    eyebrow: Nuestro impacto
    title: Dónde estamos hoy.
    body:
      - >-
        Apenas estamos comenzando, así que estas cifras son pequeñas. Preferimos
        publicarlas con honestidad antes que redondearlas hacia arriba.

  - id: cta
    eyebrow: Participe
    title: Tres maneras de apoyar.
    items:
      - icon: users
        title: Sea voluntario
        body: >-
          Sembrar, cosechar, empacar y llevar las entregas. No hace falta
          experiencia.
      - icon: basket
        title: Done materiales
        body: >-
          Semillas, plántulas, herramientas, tierra y bolsas limpias. Solo
          materiales; nunca dinero.
      - icon: heart
        title: Colabore con nosotras
        body: >-
          Si trabaja en una clínica o en un centro de embarazo en el condado de
          Union, Carolina del Norte, o cerca, nos gustaría conversar.
    ctas:
      - label: Participe
        href: /get-involved
        primary: true
      - label: Para clínicas
        href: /partners
