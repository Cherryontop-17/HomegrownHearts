title: Contacto
description: Escriba a Homegrown Hearts en el condado de Union, Carolina del Norte. Un solo correo compartido llega a ambas fundadoras y respondemos en dos o tres días.

hero:
  eyebrow: Contacto
  title: Escríbanos.
  lead: >-
    Un solo correo compartido nos llega a las dos. Respondemos en dos o tres
    días.

sections:
  - id: reach
    eyebrow: Correo
    title: Quién le va a responder.
    body:
      - >-
        Escriba a la única dirección de abajo y nos llega a las dos. Kreeshma
        se encarga de todo lo relacionado con clínicas y la lista de cultivos;
        Charishya lleva voluntariado, materiales y este sitio. No hace falta que
        adivine cuál: le responde quien corresponda.
    items:
      - title: Kreeshma Vasikarla
        body: >-
          Misión y enlace médico: colaboraciones con clínicas y lista de
          cultivos.
      - title: Charishya Yarram
        body: >-
          Operaciones y tecnología: voluntariado, materiales y logística.

  - id: expectations
    eyebrow: Qué esperar
    title: Cómo atendemos los mensajes.
    body:
      - >-
        Somos estudiantes, así que respondemos por las tardes. Dos o tres días es
        lo normal. Si nos escribe una clínica, respondemos esa misma semana.
      - >-
        Publicamos un solo correo compartido del proyecto en lugar de datos de
        contacto personales, porque ambas fundadoras son menores de edad.

  - id: privacy
    eyebrow: Privacidad
    title: Qué hacemos con lo que nos envía.
    body:
      - >-
        Escríbanos con toda confianza. Respetamos la privacidad de todas las
        personas, así que su mensaje queda entre usted y nosotras dos.
